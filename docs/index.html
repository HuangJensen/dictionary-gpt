<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线词典查询</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="white">
  <header class="topbar" id="topbar">
    <div class="brand-row">
      <h1 class="brand">📖 在线词典</h1>
      <div class="brand-actions">
        <button type="button" class="affix-btn" id="affix-btn">🔤 词缀</button>
        <div class="theme-picker" id="theme-picker">
          <button type="button" class="theme-trigger" id="theme-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="theme-dot" id="theme-dot"></span>
            <span id="theme-label">白</span>
            <span class="theme-arrow">▾</span>
          </button>
          <div class="theme-menu" id="theme-menu" role="listbox">
            <button type="button" class="theme-option" data-theme="white"><span class="dot dot-white"></span>白</button>
            <button type="button" class="theme-option" data-theme="black"><span class="dot dot-black"></span>黑</button>
            <button type="button" class="theme-option" data-theme="green"><span class="dot dot-green"></span>护眼绿（白天）</button>
            <button type="button" class="theme-option" data-theme="gray"><span class="dot dot-gray"></span>护眼灰（黑夜）</button>
          </div>
        </div>
      </div>
    </div>
    <p class="subtitle">纯静态 · 76 万词条（ECDICT）· 浏览器本地搜索</p>
    <form id="search-form" class="search-box">
      <input id="q" type="text" placeholder="输入要查询的单词，例如 hello" autocomplete="off" autofocus />
      <select id="mode" title="匹配方式">
        <option value="prefix" selected>前缀匹配</option>
        <option value="exact">精确匹配</option>
        <option value="fuzzy">模糊搜索</option>
      </select>
      <button type="submit">查询</button>
    </form>
  </header>

  <main class="container">
    <p id="status" class="status" role="status"></p>
    <ul id="results" class="results"></ul>
  </main>

  <footer class="footer">JasonHuang 出品</footer>
  <button type="button" id="backtop" class="backtop" title="回到顶部">↑</button>

  <div class="affix-panel" id="affix-panel">
    <div class="affix-head">
      <strong>🔤 词缀查询</strong>
      <button type="button" class="affix-close" id="affix-close" title="关闭">✕</button>
    </div>
    <input id="affix-q" type="text" placeholder="输入词缀，如 un- / -tion / 不…" autocomplete="off" />
    <div class="affix-list" id="affix-list"></div>
  </div>

  <script src="static-data/keys.js"></script>
  <script src="app.js"></script>
</body>
</html>
